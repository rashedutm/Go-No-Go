html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #050a17; overflow: hidden; touch-action: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
#device-note { display: none; margin-top: 2vh; font-family: 'GNGBody', Arial, sans-serif; font-size: 13px; color: #f5b83d; text-align: center; padding: 0 16px; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; top: 0; right: 0; bottom: 0; left: 0;
	background: radial-gradient(ellipse at 50% 45%, #0d1a36 0%, #050a17 70%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden; transition: opacity 0.5s ease;
}
#status.done { opacity: 0; }
#stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#status > *:not(#stars) { position: relative; }
#kicker {
	font-family: 'GNGMono', 'Courier New', monospace; font-size: clamp(10px, 1.3vw, 14px);
	letter-spacing: 0.5em; padding-left: 0.5em; color: #4fd6ff; margin-bottom: 2.5vh; opacity: 0.85; text-align: center;
}
#kicker i { color: #f5b83d; font-style: normal; letter-spacing: 0.1em; margin-right: 0.8em; }
#title-frame { padding: 2.2vh 3.2vw; margin: 0 auto; }
#title-frame .c { position: absolute; width: 34px; height: 34px; border: 0 solid #4fd6ff; opacity: 0.8;
	filter: drop-shadow(0 0 6px rgba(79, 214, 255, 0.8)); animation: corner 2.4s ease-in-out infinite; }
#title-frame .tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
#title-frame .tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
#title-frame .bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
#title-frame .br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }
@keyframes corner { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
#liquid { display: block; width: min(76vw, 960px); height: auto; overflow: visible; }
/* bubbles rising through the water */
.bubble { fill: rgba(220, 248, 255, 0.55); animation: rise linear infinite; }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 0.8; } to { transform: translateY(-230px); opacity: 0; } }
#status-line {
	font-family: 'GNGMono', 'Courier New', monospace; font-size: clamp(11px, 1.6vw, 16px);
	letter-spacing: 0.35em; padding-left: 0.35em; color: #a9bcd9; margin-top: 2.2vh; text-transform: uppercase; text-align: center;
}
#status-line b { color: #f5b83d; font-weight: normal; }
#fact-box {
	margin-top: 4.5vh; width: min(640px, 86vw); text-align: center; min-height: 6.5em;
	transition: opacity 0.6s ease;
}
#fact-box.fading { opacity: 0; }
#fact-kicker {
	font-family: 'GNGMono', 'Courier New', monospace; font-size: clamp(10px, 1.2vw, 13px);
	letter-spacing: 0.35em; padding-left: 0.35em; color: #f5b83d; margin-bottom: 0.8em;
}
#fact-text {
	font-family: 'GNGBody', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: clamp(14px, 1.9vw, 19px);
	line-height: 1.45; color: #dce8fb;
}
#status-notice {
	display: none; background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 2rem; padding: 1rem; text-align: center;
}

/* water surface: two waves drifting at different speeds */
.wave-back { animation: drift 3.2s linear infinite; }
.wave-front { animation: drift 2.1s linear infinite reverse; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-400px); } }
#water { transition: transform 0.25s linear; }
.title-text { font-family: 'GNGDisplay', 'Arial Narrow', Impact, sans-serif; font-size: 230px; font-weight: 800; letter-spacing: 4px; }

					<g id="water" transform="translate(0 300)">
						<path class="wave-back" fill="#2b8fe0" opacity="0.65"
							d="M0 10 Q 50 -8 100 10 T 200 10 T 300 10 T 400 10 T 500 10 T 600 10 T 700 10 T 800 10 T 900 10 T 1000 10 T 1100 10 T 1200 10 T 1300 10 T 1400 10 V 400 H 0 Z"/>
						<path class="wave-front" fill="url(#water-grad)"
							d="M0 16 Q 50 2 100 16 T 200 16 T 300 16 T 400 16 T 500 16 T 600 16 T 700 16 T 800 16 T 900 16 T 1000 16 T 1100 16 T 1200 16 T 1300 16 T 1400 16 V 400 H 0 Z"/>
						<g id="bubbles"></g>
					</g>
				</g>
				<!-- letter outlines on top -->
				<g fill="none" stroke="#4fd6ff" stroke-width="3" filter="url(#glow)" opacity="0.9">
					<text id="line-go" class="title-text" x="0" y="250">GO</text>
					<text id="line-nogo" class="title-text" x="0" y="250">NO-GO</text>
				</g>
				<!-- gold slash (a slanted bar, a different shape from the letters) -->
				<polygon id="slash" points="0,0 0,0 0,0 0,0" fill="#f5b83d" filter="url(#glow)"/>
			</svg>
			</div>
			<div id="status-line">Loading mission data <b id="status-pct">0%</b></div>
			<div id="fact-box">
				<div id="fact-kicker">DID YOU KNOW?</div>
				<div id="fact-text"></div>
			</div>
			<div id="device-note">Go/No-Go is made for a computer with a mouse and keyboard. On a phone or tablet it may be hard to control.</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8497452,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const statusLine = document.getElementById('status-line');
	const pctLabel = document.getElementById('status-pct');
	const water = document.getElementById('water');

	// ---- layout: "GO" + gold slash + "NO-GO", centred, measured after the font is ready
	const TOP = 70, BOTTOM = 252;      // letter top and baseline in SVG units (cap height of the font)
	function layout() {
		const go = document.getElementById('clip-go'), nogo = document.getElementById('clip-nogo');
		const w1 = go.getComputedTextLength(), w2 = nogo.getComputedTextLength();
		const gap = 120, total = w1 + gap + w2, x0 = (1000 - total) / 2;
		for (const id of ['clip-go', 'line-go']) document.getElementById(id).setAttribute('x', x0);
		for (const id of ['clip-nogo', 'line-nogo']) document.getElementById(id).setAttribute('x', x0 + w1 + gap);
		const cx = x0 + w1 + gap / 2;
		document.getElementById('slash').setAttribute('points',
			`${cx + 18},${TOP} ${cx + 44},${TOP} ${cx - 18},${BOTTOM} ${cx - 44},${BOTTOM}`);
	}
	(document.fonts && document.fonts.load ? document.fonts.load("230px 'GNGDisplay'") : Promise.resolve()).then(layout, layout);

	// ---- space facts to read while the game downloads (rotate every 7 s)
	const FACTS = [
		'Sunlight takes about 8 minutes to travel from the Sun to Earth.',
		'A radio message from Mars takes between about 3 and 22 minutes to reach Earth, depending on where the two planets are.',
		'The International Space Station circles Earth about every 90 minutes, so its crew sees around 16 sunrises a day.',
		'More than 1,300 Earths could fit inside Jupiter.',
		'Juno runs on solar power at Jupiter, where sunlight is only about 4% as strong as at Earth. Its solar wings are huge.',
		'Saturn’s rings are mostly water ice, in pieces from tiny grains to chunks as big as mountains.',
		'The Moon drifts about 3.8 cm farther from Earth every year.',
		'NASA talks to faraway spacecraft through the Deep Space Network: giant antennas in California, Spain and Australia.',
		'Olympus Mons on Mars is the largest volcano in the Solar System, about two and a half times as tall as Mount Everest.',
		'Cassini studied Saturn for 13 years, then ended its mission with a dive into the planet in 2017.',
		'A CubeSat is built from 10 cm cubes. Each cube is called one “U”.',
		'Voyager 1, launched in 1977, is the most distant human-made object, more than 24 billion km from Earth.',
	];
	const factText = document.getElementById('fact-text');
	const factBox = document.getElementById('fact-box');
	let factIdx = Math.floor(Math.random() * FACTS.length);
	factText.textContent = FACTS[factIdx];
	const factTimer = setInterval(() => {
		factBox.classList.add('fading');
		setTimeout(() => {
			factIdx = (factIdx + 1) % FACTS.length;
			factText.textContent = FACTS[factIdx];
			factBox.classList.remove('fading');
		}, 600);
	}, 7000);

	// phones/tablets (touch only, no mouse): show a friendly note
	try {
		if (matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) {
			document.getElementById('device-note').style.display = 'block';
		}
	} catch (e) {}

	// ---- bubbles rising inside the water
	const bubbleGroup = document.getElementById('bubbles');
	for (let i = 0; i < 18; i++) {
		const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
		c.setAttribute('class', 'bubble');
		c.setAttribute('cx', (Math.random() * 1000).toFixed(0));
		c.setAttribute('cy', (250 + Math.random() * 40).toFixed(0));
		c.setAttribute('r', (2 + Math.random() * 4.5).toFixed(1));
		c.style.animationDuration = (2.4 + Math.random() * 2.8).toFixed(2) + 's';
		c.style.animationDelay = (-Math.random() * 5).toFixed(2) + 's';
		bubbleGroup.appendChild(c);
	}

	// ---- twinkling, slowly drifting starfield
	const starCanvas = document.getElementById('stars');
	const sctx = starCanvas.getContext('2d');
	let stars = [];
	function resizeStars() {
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		starCanvas.width = innerWidth * dpr;
		starCanvas.height = innerHeight * dpr;
		stars = [];
		const n = Math.floor(innerWidth * innerHeight / 5000);
		for (let i = 0; i < n; i++) {
			stars.push({ x: Math.random(), y: Math.random(), r: (Math.random() * 1.3 + 0.3) * dpr,
				s: Math.random() * 0.012 + 0.002, p: Math.random() * 6.28, gold: Math.random() < 0.08 });
		}
	}
	resizeStars();
	addEventListener('resize', resizeStars);
	function drawStars(t) {
		sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
		for (const st of stars) {
			st.x -= st.s * 0.02;
			if (st.x < 0) st.x += 1;
			const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.0012 + st.p));
			sctx.fillStyle = st.gold ? `rgba(245,184,61,${a})` : `rgba(200,225,255,${a})`;
			sctx.beginPath();
			sctx.arc(st.x * starCanvas.width, st.y * starCanvas.height, st.r, 0, 6.283);
			sctx.fill();
		}
	}

	// ---- water level: follows the real download, but never fills faster than MIN_MS,
	//      so even on fast internet there's time to see the animation and read a fact
	const MIN_MS = 6000;
	const t0 = performance.now();
	let target = 0.04, shown = 0, loaded = false, finishing = false;
	function frame() {
		const now = performance.now();
		const elapsed = (now - t0) / MIN_MS;
		const goal = Math.min(target, elapsed);
		shown += (goal - shown) * 0.1;
		const y = BOTTOM + 10 - (BOTTOM + 10 - TOP + 14) * shown;   // 0 = below letters, 1 = above them
		water.setAttribute('transform', `translate(0 ${y.toFixed(1)})`);
		pctLabel.textContent = Math.min(100, Math.round(shown * 100)) + '%';
		drawStars(now);
		if (loaded && !finishing && elapsed >= 1 && shown > 0.985) {
			finishing = true;
			pctLabel.textContent = '100%';
			setTimeout(() => {
				statusOverlay.classList.add('done');
				setTimeout(() => {
					clearInterval(frameTimer);
					clearInterval(factTimer);
					statusOverlay.remove();
					initializing = false;
				}, 500);
			}, 400);
		}
	}
	let frameTimer = 0;

	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			loaded = true;     // the frame loop finishes the fill (at least MIN_MS) and fades out
			target = 1;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusLine.style.display = mode === 'notice' ? 'none' : 'block';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		clearInterval(frameTimer);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
			]).then(() => { window.location.reload(); }).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('This browser is missing features the game needs:\n' + missing.join('\n') +
				'\n\nPlease use an up-to-date Chrome, Edge, Firefox, Brave or Safari (version 15 or newer).');
		}
	} else {
		setStatusMode('progress');
		frameTimer = setInterval(frame, 33);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					target = Math.max(target, Math.min(0.97, current / total));   // the last bit fills on start
				}
			},
		}).then(() => { setStatusMode('hidden'); }, displayFailureNotice);
	}
}());
		</script>
